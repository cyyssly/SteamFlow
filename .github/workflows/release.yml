name: Release

# 推送 v* 标签（如 v1.0.0）时自动构建 Windows 发布包并创建 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与本地开发环境保持一致的 Flutter 版本，避免构建差异
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      # 运行所需文件都在 runner\Release 目录下，整体打包成 zip
      - name: Package
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "SteamFlow-${{ github.ref_name }}-windows-x64.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: SteamFlow-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
