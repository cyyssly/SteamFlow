name: Release

# 推送 v* 标签（如 v1.0.0）时自动构建 Windows 与 Android 发布包并创建 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # 与本地 pubspec.lock 中记录的镜像地址保持一致。
  # 否则 pub get 会因 hosted URL 不同而重新解析依赖，拉取未经验证的最新版本
  # （例如 shared_preferences_android 2.5.1，会导致 Android 启动白屏）。
  PUB_HOSTED_URL: 'https://pub.flutter-io.cn'

jobs:
  # 质量门禁：静态分析与单元测试，失败时不产出发布包
  verify:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  windows:
    needs: verify
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与本地开发环境保持一致的 Flutter 版本，避免构建差异
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows release
        run: flutter build windows --release

      # 运行所需文件都在 runner\Release 目录下，整体打包成 zip
      - name: Package
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "SteamFlow-${{ github.ref_name }}-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: SteamFlow-*.zip
          if-no-files-found: error

  android:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 9 / Gradle 9 需要 JDK 17 及以上
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      # 签名密钥通过 Secrets 注入，不写入仓库；
      # 未配置 Secrets 时 build.gradle.kts 会自动回退到 debug 签名。
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未提供签名密钥，将使用 debug 签名打包"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storePassword=$STORE_PASSWORD
          EOF

      # 把 CI 实际解析到的关键版本以 ::notice:: 注释上报（注释可匿名读取），
      # 便于在无法登录查看日志时核对环境差异。
      - name: Report Android environment
        run: |
          set +e
          FL=$(flutter --version | head -n 1)
          FP=$(ls -d ~/.pub-cache/hosted/*/file_picker-* 2>/dev/null | head -n 1)
          CS=$(grep -m1 "compileSdk" "$FP/android/build.gradle" 2>/dev/null | tr -d ' ')
          LF=$(ls -d ~/.pub-cache/hosted/*/flutter_plugin_android_lifecycle-* 2>/dev/null | head -n 1)
          echo "::notice title=ci-env::flutter=$FL | file_picker=$FP ($CS) | lifecycle=$LF"

      # 环境探测、依赖安装与构建合并在同一步，失败时把 Gradle 的“What went wrong”
      # 片段以 ::error:: 注释抛出：Actions 日志需登录才能查看，而 check-run 注释可匿名读取。
      - name: Build Android release
        run: |
          set -o pipefail
          {
            set -ex
            flutter doctor -v || true
            yes | flutter doctor --android-licenses > /dev/null 2>&1 || true
            flutter pub get --enforce-lockfile
            flutter build apk --release
          } 2>&1 | tee android-build.log || {
            ERR=$(sed -n '/What went wrong/,$p' android-build.log | head -n 25 | tr '\n' '~')
            [ -n "$ERR" ] || ERR=$(tail -n 40 android-build.log | tr '\n' '~')
            echo "::error title=Android build failed::$ERR"
            exit 1
          }

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "SteamFlow-${GITHUB_REF_NAME}-android.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: SteamFlow-*-android.apk
          if-no-files-found: error

  # 两个构建任务都完成后统一发布，避免两次并发创建同一个 Release
  release:
    name: Publish GitHub Release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      # 必须检出仓库：发布说明文件在仓库内，仅下载构建产物拿不到
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -l dist

      # 仓库内存在对应版本的说明文档时，用它作为 Release 正文；
      # 找不到则回退到 GitHub 自动生成的变更列表
      - name: Resolve release notes
        id: notes
        run: |
          NOTES="release/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "body_path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "Using $NOTES"
          else
            echo "No release notes file, falling back to generated notes"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          # 有自定义说明时不再让 GitHub 生成变更列表，避免两者互相覆盖
          generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
          body_path: ${{ steps.notes.outputs.body_path }}
          draft: false
          prerelease: false

      # 显式再写一次正文：action 在更新既有 Release 时未必会覆盖正文，
      # 用 gh release edit 保证自定义说明一定生效
      - name: Apply release notes
        if: steps.notes.outputs.body_path != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --notes-file "${{ steps.notes.outputs.body_path }}"
