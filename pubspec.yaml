name: steam_flow
description: "A cross-platform video player and slideshow application."
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 9.0.1 起 getDirectoryPath() 在独立 isolate 中初始化/释放 COM，
  # 修复了 Windows 上主线程 CoUninitialize 导致的原生崩溃（comdlg32.dll 0xc0000005）。
  # 注意：10.1.1+ 起 Android 实现迁移到 Kotlin，与 AGP 9 存在兼容问题，暂不升级到 10.x。
  file_picker: ^9.0.3
  # 固定版本：2.5.6 起依赖的 shared_preferences_android 2.5.1 迁移到 JNI，
  # 在 Flutter 3.44.8 的 release 包中启动即报 NoSuchMethodError（表现为白屏）。
  shared_preferences: 2.5.5
  provider: ^6.1.1
  image: ^4.1.7
  url_launcher: ^6.2.4
  ffi: ^2.1.4
  vector_math: ^2.1.4
  wakelock_plus: ^1.5.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  # 共享源封面缩略图的磁盘缓存目录
  path_provider: ^2.1.5
  # 桌面端关闭窗口后收起到系统托盘，保持共享服务继续运行
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# media_kit 的 main 分支已修掉「热重载 / 热重启后，mpv 仍调用指向已删除 Dart
# 回调的 wakeup 句柄，导致 Dart VM 报 Callback invoked after it has been deleted
# 并直接 abort」这一缺陷（见 media-kit/media-kit#1314、#1430），但尚未发布到
# pub.dev。因此这里用 dependency_overrides 精确指向该提交；
# 等上游正式发版后，删掉本段、把版本约束升到对应版本即可。
dependency_overrides:
  # 强制 Android 实现停留在 JNI 迁移前的版本：2.5.1 在当前 Flutter 版本下
  # 启动读取设置时会抛 NoSuchMethodError，导致 release 包白屏。
  shared_preferences_android: 2.4.27
  media_kit:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: c533e446755f51cf53c7e57aea873f2aa5355f81
      path: media_kit

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
